name: Build and Deploy Spring Boot

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ydvakash/med-doc

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Run tests
      - name: Run tests
        run: mvn clean test

      # 4. Build Spring Boot JAR
      - name: Build application
        run: mvn package -DskipTests

      # 5. Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .

      # 7. Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 8. Prepare EC2
      - name: Prepare EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================="
            echo "Checking EC2..."
            echo "================================="

            # -----------------------------------
            # Update package information
            # -----------------------------------
            sudo apt-get update -y

            # -----------------------------------
            # Install Docker if missing
            # -----------------------------------
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing Docker..."

              sudo apt-get install -y docker.io

              sudo systemctl enable docker
              sudo systemctl start docker
            else
              echo "Docker already installed."
            fi

            # -----------------------------------
            # Install Docker Compose if missing
            # -----------------------------------
            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose not found. Installing..."

              sudo apt-get install -y docker-compose-v2
            else
              echo "Docker Compose already installed."
            fi

            # -----------------------------------
            # Make sure Docker is running
            # -----------------------------------
            if ! sudo systemctl is-active --quiet docker; then
              echo "Docker is not running. Starting Docker..."

              sudo systemctl start docker
            else
              echo "Docker is running."
            fi

            # -----------------------------------
            # Install Docker Compose if missing
            # -----------------------------------
            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose not found. Installing..."

              sudo apt-get install -y docker-compose-v2
            else
              echo "Docker Compose already installed."
            fi

            # -----------------------------------
            # Verify installations
            # -----------------------------------
            echo "Docker version:"
            sudo docker --version

            echo "Docker Compose version:"
            sudo docker compose version

            # -----------------------------------
            # Create application directory
            # -----------------------------------
            mkdir -p ~/my-spring-app

            echo "================================="
            echo "EC2 preparation completed."
            echo "================================="

      # 9. Deploy to EC2
        # 9. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
      
          script: |
            set -e
      
            echo "================================="
            echo "Starting deployment..."
            echo "================================="
      
            mkdir -p ~/my-spring-app
            cd ~/my-spring-app
      
            # -----------------------------------
            # Create Docker Compose file
            # -----------------------------------
            cat > docker-compose.yml <<'EOF'
            services:
              med-doc:
                image: ghcr.io/ydvakash/med-doc:${{ github.sha }}
                container_name: med-doc
                restart: unless-stopped
                ports:
                  - "8080:8080"
            EOF
      
            # -----------------------------------
            # Login to GHCR
            # -----------------------------------
            echo "Logging into GHCR..."
      
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin
      
            # -----------------------------------
            # Pull latest image
            # -----------------------------------
            echo "Pulling Docker image..."
      
            sudo docker compose pull
      
            # -----------------------------------
            # Start application
            # -----------------------------------
            echo "Starting application..."
      
            sudo docker compose up -d --remove-orphans
      
            # -----------------------------------
            # Clean old images
            # -----------------------------------
            echo "Cleaning unused Docker images..."
      
            sudo docker image prune -f
      
            # -----------------------------------
            # Show running containers
            # -----------------------------------
            echo "Running containers:"
      
            sudo docker ps
      
            echo "================================="
            echo "Deployment completed!"
            echo "================================="
